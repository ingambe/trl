name: GPU benchmark

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Candidate commit or branch
        required: true
        default: main
      base_ref:
        description: Base commit or branch
        required: true
        default: main

permissions: {}

jobs:
  benchmark:
    permissions:
      contents: read
    name: ${{ matrix.benchmark }}, ${{ matrix.gpus }} GPU
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        benchmark: [wordle, wordle-lora, number, number-lora]
        gpus: [1]
        include:
          - benchmark: wordle
            gpus: 2
          - benchmark: number
            gpus: 2
          - benchmark: wordle-lora-3b
            gpus: 2
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.12'

      - name: Install the controller
        run: python -m pip install -r tools/pr_benchmark/requirements-controller.txt

      - name: Compare
        env:
          GH_TOKEN: ${{ github.token }}
          OPENBAYES_TOKEN: ${{ secrets.OPENBAYES_TOKEN }}
          HYPERAI_RUNTIME: ${{ vars.HYPERAI_RUNTIME }}
          HYPERAI_ENVIRONMENT_JOB: ${{ matrix.benchmark == 'wordle-lora-3b' && vars.HYPERAI_ENVIRONMENT_JOB_3B || vars.HYPERAI_ENVIRONMENT_JOB }}
          REF: ${{ inputs.ref }}
          BASE_REF: ${{ inputs.base_ref }}
        # Jobs queue behind each other on Hyper.ai; GitHub stops a job after 360 minutes
        shell: bash
        run: |
          python tools/pr_benchmark/controller.py compare --repo "$GITHUB_REPOSITORY" --ref "$REF" \
            --base-ref "$BASE_REF" --profile ${{ matrix.benchmark }} --gpus ${{ matrix.gpus }} --state-dir "$RUNNER_TEMP/trl-bench" \
            --timeout-minutes 60 --queue-minutes 210 --daily-compute-minutes 240 | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: benchmark-${{ matrix.benchmark }}-${{ matrix.gpus }}gpu
          path: ${{ runner.temp }}/trl-bench/runs
